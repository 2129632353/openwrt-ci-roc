name: IPQ807X-LibWrt

于:
  workflow_dispatch:
  workflow_call:
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/laipeng668/openwrt-6.x.git
      repo_branch: 25.12-nss
      config_file: configs/IPQ807X.config
      firmware_tag: IPQ807X
      kernel_file: kernel-6.12
      artifact_prefix: IPQ807X
      manifest_file: libwrt-qualcommax-ipq807x.manifest
      release_summary: >-
        这是开启全功能NSS的6.12内核固件，默认主题为Aurora；该固件在ImmortalWrt的基础上，添加了额外的软件包acme、ddns、upnp、wol、samba4、aria2、autoreboot、uhttpd、diskman、hd-idle、openlist2、dockerman、gecoosac、watchcat、nikki、momo、tailscale、easytier、unblockneteasemusic、clashoo，并添加了若干工具，具体详见x86-64.config和General.config。
